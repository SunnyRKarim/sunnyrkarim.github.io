name: Publish revised academic CV PDF
on:
  push:
    paths:
      - '.github/workflows/publish-academic-cv.yml'

permissions:
  contents: write

jobs:
  publish-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compile current academic CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: .cv-build
      - name: Validate PDF and absence of references
        shell: bash
        run: |
          set -euo pipefail
          test -s .cv-build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          path = Path(".cv-build/main.pdf")
          reader = PdfReader(str(path))
          content = "\n".join(p.extract_text() or "" for p in reader.pages)
          for term in ["Sunny Rabiul Karim", "CCC Test", "UN-DID", "DID-INT"]:
              assert term in content, f"Missing expected CV content: {term}"
          assert "References" not in content, "Unexpected references section"
          assert 2 <= len(reader.pages) <= 6, f"Unexpected number of CV pages: {len(reader.pages)}"
          print("Verified reference-free CV:", len(reader.pages), "pages;", path.stat().st_size, "bytes")
          PY
      - name: Replace website CV PDF
        shell: bash
        run: |
          set -euo pipefail
          cp .cv-build/main.pdf assets/cv/Academic-CV-Sunny.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/cv/Academic-CV-Sunny.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Refresh website CV PDF from updated reference-free main.tex"
            git push origin HEAD:main
          fi
