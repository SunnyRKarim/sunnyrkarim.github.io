name: Publish updated Academic CV PDF
on:
  push:
    paths:
      - '.github/workflows/publish-academic-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compile the exact current academic CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: .cv-build

      - name: Validate PDF and CCC Test entry
        shell: bash
        run: |
          set -euo pipefail
          test -s .cv-build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          path = Path(".cv-build/main.pdf")
          reader = PdfReader(str(path))
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          assert len(reader.pages) >= 2, "Unexpectedly short CV"
          assert "CCC Test" in text, "CCC Test entry not found in compiled PDF"
          assert "UN-DID" in text, "Existing software entries not found"
          assert "Stata" in text and "Python" in text, "Software implementations not found"
          print("CV validation passed:", len(reader.pages), "pages;", path.stat().st_size, "bytes")
          PY

      - name: Replace website CV PDF, without altering website markup
        shell: bash
        run: |
          set -euo pipefail
          cp .cv-build/main.pdf assets/cv/Academic-CV-Sunny.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/cv/Academic-CV-Sunny.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated Academic CV from main.tex"
            git push origin HEAD:main
          fi
