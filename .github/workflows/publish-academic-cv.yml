name: Publish revised academic CV PDF
on:
  push:
    paths:
      - '.github/workflows/publish-academic-cv.yml'

permissions:
  contents: write

jobs:
  publish-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compile current academic CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: .cv-build
      - name: Validate updated PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s .cv-build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          path = Path(".cv-build/main.pdf")
          reader = PdfReader(str(path))
          content = "\n".join(p.extract_text() or "" for p in reader.pages)
          for name in ["Sunny Rabiul Karim", "CCC Test", "UN-DID", "DID-INT"]:
              assert name in content, f"Missing from compiled CV: {name}"
          assert len(reader.pages) >= 2, "Unexpected PDF length"
          print("Validated current CV", len(reader.pages), "pages", path.stat().st_size, "bytes")
          PY
      - name: Replace public website CV PDF
        shell: bash
        run: |
          set -euo pipefail
          cp .cv-build/main.pdf assets/cv/Academic-CV-Sunny.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/cv/Academic-CV-Sunny.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Refresh website Academic CV PDF from latest main.tex"
            git push origin HEAD:main
          fi
